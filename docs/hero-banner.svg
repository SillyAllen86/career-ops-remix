<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Career-Ops Remix Hero Banner</title>
  <desc id="desc">OpenAI and Codex first job-search command center with workflow cards, scoring, and tracker pipeline.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07111f"/>
      <stop offset="55%" stop-color="#0b2540"/>
      <stop offset="100%" stop-color="#14324d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#19c37d"/>
      <stop offset="100%" stop-color="#6ee7ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="30" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <style>
      .title { font: 700 72px/1.1 "Inter", "Segoe UI", sans-serif; fill: #f7fbff; }
      .subtitle { font: 400 28px/1.5 "Inter", "Segoe UI", sans-serif; fill: #c4d4e8; }
      .label { font: 600 22px/1.2 "Inter", "Segoe UI", sans-serif; fill: #b7e4c7; letter-spacing: .12em; text-transform: uppercase; }
      .card-title { font: 700 28px/1.2 "Inter", "Segoe UI", sans-serif; fill: #eef7ff; }
      .card-body { font: 400 22px/1.5 "Inter", "Segoe UI", sans-serif; fill: #bfd0e4; }
      .metric { font: 700 30px/1.1 "Inter", "Segoe UI", sans-serif; fill: #fff; }
      .metric-sub { font: 400 18px/1.3 "Inter", "Segoe UI", sans-serif; fill: #c4d4e8; }
      .mono { font: 600 18px/1.4 "SFMono-Regular", "Cascadia Code", monospace; fill: #a9c7de; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1320" cy="140" r="210" fill="#19c37d" opacity="0.16"/>
  <circle cx="1380" cy="210" r="120" fill="#6ee7ff" opacity="0.10"/>
  <circle cx="260" cy="700" r="260" fill="#6ee7ff" opacity="0.08"/>
  <path d="M0 710 C 260 640, 360 780, 620 710 S 980 640, 1600 720 L1600 900 L0 900 Z" fill="#0a1b2d" opacity="0.75"/>

  <g transform="translate(110,120)">
    <text class="label" x="0" y="0">OpenAI / Codex first</text>
    <text class="title" x="0" y="96">Career-Ops Remix</text>
    <text class="subtitle" x="0" y="150">A public, sanitized job-search command center built for GitHub</text>
    <text class="subtitle" x="0" y="190">Evaluation, PDF generation, portal scanning, batch runs, and tracking.</text>

    <g transform="translate(0,270)">
      <rect x="0" y="0" rx="28" ry="28" width="420" height="176" fill="#0d1f34" opacity="0.94" filter="url(#shadow)"/>
      <rect x="26" y="26" rx="16" ry="16" width="90" height="90" fill="url(#accent)" opacity="0.95"/>
      <path d="M46 72h50M46 95h50M46 118h30" stroke="#04131f" stroke-width="7" stroke-linecap="round"/>
      <text class="card-title" x="140" y="58">Structured evaluation</text>
      <text class="card-body" x="140" y="94">A-F scoring, legitimacy checks,</text>
      <text class="card-body" x="140" y="124">and clear publishable reports.</text>
      <text class="mono" x="26" y="154">report.md + tracker TSV + PDF</text>
    </g>

    <g transform="translate(462,270)">
      <rect x="0" y="0" rx="28" ry="28" width="420" height="176" fill="#10263d" opacity="0.94" filter="url(#shadow)"/>
      <circle cx="68" cy="74" r="42" fill="#6ee7ff" opacity="0.92"/>
      <path d="M50 74h36M68 56v36M56 62l24 24M80 62L56 86" stroke="#082235" stroke-width="7" stroke-linecap="round"/>
      <text class="card-title" x="140" y="58">OpenAI workflow</text>
      <text class="card-body" x="140" y="94">Codex / OpenAI documented</text>
      <text class="card-body" x="140" y="124">as the primary runtime.</text>
      <text class="mono" x="26" y="154">AGENTS.md + CAREER_OPS_AGENT.md</text>
    </g>

    <g transform="translate(924,270)">
      <rect x="0" y="0" rx="28" ry="28" width="420" height="176" fill="#0d1c2b" opacity="0.94" filter="url(#shadow)"/>
      <rect x="28" y="24" rx="20" ry="20" width="112" height="120" fill="#132c46"/>
      <path d="M56 54h56M56 82h56M56 110h38" stroke="#19c37d" stroke-width="7" stroke-linecap="round"/>
      <text class="card-title" x="160" y="58">GitHub-ready remix</text>
      <text class="card-body" x="160" y="94">Templates, docs, and images</text>
      <text class="card-body" x="160" y="124">that can stand on their own.</text>
      <text class="mono" x="26" y="154">public repo / no private candidate data</text>
    </g>
  </g>
</svg>
