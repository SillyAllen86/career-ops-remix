    api: https://takeda.wd3.myworkdayjobs.com/wday/cxs/takeda/External/jobs
    notes: "Highest-priority manufacturing, labs, and platform target."
    enabled: true

  - name: Eppendorf
    careers_url: https://eppendorf.wd3.myworkdayjobs.com/en-US/Eppendorf
    api_provider: workday
    api: https://eppendorf.wd3.myworkdayjobs.com/wday/cxs/eppendorf/Eppendorf/jobs
