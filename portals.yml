# Portal Scanner Configuration
# Tuned for Pravin's strongest lanes:
# - regulated life sciences digital transformation
# - integration / solution / enterprise / data architecture
# - manufacturing, laboratory, quality, and platform leadership
#
# Practical note:
# `scan.mjs` currently performs incremental scans only for ATS providers it can hit
# directly (Greenhouse, Ashby, Lever, and now Workday). The search queries below are
# still useful for manual initial sourcing and browser-assisted discovery.

title_filter:
  positive:
    - "Digitalization"
    - "Digitalisation"
    - "Digital Transformation"
    - "Transformation"
    - "Platform"
    - "Integration"
    - "Integration Platform"
    - "Enterprise Architect"
    - "Solution Architect"
    - "Solutions Architect"
    - "Systems Architect"
    - "Data Architect"
    - "Enterprise Data"
    - "Product Supply"
    - "Manufacturing Digital"
    - "Manufacturing Systems"
    - "Lab"
    - "Laboratory"
    - "Laboratory Systems"
    - "Quality Systems"
    - "LES"
    - "LIMS"
    - "MES"
    - "ERP"
    - "Workflow"
    - "Orchestration"
    - "Operational Excellence"
    - "Program Lead"
    - "Program Management"
  negative:
    - "Junior"
    - "Intern"
    - "Sales"
    - "Account Executive"
    - "Account Director"
    - "Customer Success"
    - "Field Sales"
    - "Commercial Digital"
    - "CRM"
    - "PromoMats"
    - "Veeva CRM"
    - "Medical Science Liaison"
    - "Medical Director"
    - "Pure Data Scientist"
    - "Scientist"
    - "Research Associate"
    - "Lab Technician"
    - "Laboratory Technician"
    - "Technician"
    - "Inspector"
    - "Operator"
    - "PLC"
    - "Firmware"
    - "Embedded"
    - "iOS"
    - "Android"
    - "Frontend"
    - "Backend"
    - ".NET"
    - "PHP"
    - "Ruby"
    - "Nurse"
    - "EMT"
    - "Phlebotomist"
    - "Marketing"
    - "Brand"
    - "Communications"
    - "Forecasting"
    - "Reimbursement"
    - "Legal"
    - "Counsel"
    - "Retail"
    - "E-Commerce"
    - "Instructional"
    - "Learning"
  seniority_boost:
    - "Senior"
    - "Lead"
    - "Principal"
    - "Head"
    - "Director"
    - "Associate Director"

search_queries:
  - name: BioNTech integration and digital platforms
    query: 'site:jobs.biontech.com ("integration platform" OR "digital solutions" OR "manufacturing" OR "data" OR "platform")'
    enabled: true

  - name: Takeda manufacturing labs and digital platforms
    query: 'site:takeda.wd3.myworkdayjobs.com ("manufacturing" OR "labs" OR "digital platforms" OR "operational excellence" OR "data architect")'
    enabled: true

  - name: Fresenius enterprise data and digital transformation
    query: 'site:fresenius.com ("enterprise data architect" OR "digital transformation" OR "enterprise architect" OR "integration")'
    enabled: true

  - name: Bayer digital transformation and AI programs
    query: 'site:jobs.bayer.com ("digital" OR "AI" OR "platform" OR "transformation" OR "program manager")'
    enabled: true

  - name: Merck life sciences architecture and platforms
    query: 'site:jobs.merckgroup.com ("enterprise architect" OR "integration" OR "data architect" OR "digital transformation" OR "quality systems")'
    enabled: true

  - name: Eppendorf workday architecture and SAP transformation
    query: 'site:eppendorf.wd3.myworkdayjobs.com ("architecture" OR "integration" OR "digital" OR "SAP" OR "data")'
    enabled: true

  - name: Siemens Energy integration architecture
    query: 'site:siemens-energy.com/jobs OR site:jobs.siemens-energy.com ("integration" OR "architecture" OR "digital consulting" OR "platform")'
    enabled: true

  - name: SAP data architecture and program leadership
    query: 'site:performancemanager5.successfactors.eu ("data architect" OR "global program lead" OR "enterprise architect" OR "integration")'
    enabled: true

  - name: Daiichi Sankyo ERP and application platforms
    query: 'site:careers.daiichi-sankyo.eu OR site:daiichi-sankyo.com ("ERP" OR "application" OR "platform" OR "supply chain solutions")'
    enabled: true

  - name: Life sciences workday architecture roles
    query: 'site:*.myworkdayjobs.com ("data architect" OR "solutions architect" OR "integration" OR "digital transformation") ("pharma" OR "biotech" OR "life sciences")'
    enabled: true

  - name: Regulated manufacturing and lab digital roles
    query: '("manufacturing digital" OR "lab digitalization" OR "laboratory systems" OR "product supply") ("pharma" OR "biotech" OR "life sciences") ("director" OR "head" OR "lead")'
    enabled: true

tracked_companies:
  # Core priority list for incremental scans.
  # These are ATS-backed entries the current scanner can query directly.

  - name: Takeda
    careers_url: https://takeda.wd3.myworkdayjobs.com/en-US/External
