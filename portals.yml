    enabled: true

  - name: Benchling
    careers_url: https://jobs.lever.co/benchling
    notes: "Life-sciences R&D software and platform workflows."
    enabled: true

  - name: Veeva Systems
    careers_url: https://jobs.lever.co/veeva
    notes: "Regulated systems and quality/compliance-adjacent platform roles."
    enabled: true

