    notes: "Large pharma; digital/tech hub is Hyderabad/Barcelona but Germany roles appear. Watch for enterprise architect and platform lead."
    enabled: true

  - name: CSL Behring
    careers_url: https://csl.wd1.myworkdayjobs.com/en-US/CSL_External
    api_provider: workday
    api: https://csl.wd1.myworkdayjobs.com/wday/cxs/csl/CSL_External/jobs
    notes: "Marburg site — regulated pharma manufacturing. SC/automation architect + data governance roles. Supply chain + GxP context fits."
    enabled: true

  - name: Sartorius
    careers_url: https://sartorius.wd3.myworkdayjobs.com/sartoriuscareers
    api_provider: workday
    api: https://sartorius.wd3.myworkdayjobs.com/wday/cxs/sartorius/sartoriuscareers/jobs
    notes: "Life sciences technology company, Göttingen HQ. SAP S/4HANA migration underway — watch for enterprise architect and transformation lead roles as migration progresses."
    enabled: true

  - name: Boehringer Ingelheim
    careers_url: https://jobs.boehringer-ingelheim.com/search/
    api_provider: none
    scan_method: websearch
    scan_query: 'site:jobs.boehringer-ingelheim.com ("digital" OR "digitalisation" OR "transformation" OR "architect" OR "platform" OR "AI lead")'
    notes: "Ingelheim (45 min Frankfurt). Pharma/animal health. Watch for Data&AI Lead, digital transformation, and enterprise architect roles."
    enabled: true

  - name: Palantir
    careers_url: https://jobs.lever.co/palantir
    notes: "Selective adjacent target for platform, deployment, and systems translation work."
    enabled: false

  - name: OpenAI
    careers_url: https://openai.com/careers
    scan_method: websearch
    scan_query: 'site:openai.com/careers "solutions" OR "platform" OR "manufacturing" OR "data"'
    notes: "Kept as a low-probability adjacent option; not part of the main loop."
    enabled: false

apply:
  portals:
    - portal_id: takeda
      ats_type: workday
      login_entry_url: https://takeda.wd3.myworkdayjobs.com/en-US/External/login
      profile_url: https://takeda.wd3.myworkdayjobs.com/en-US/External/userHome
      status_page_url: https://takeda.wd3.myworkdayjobs.com/en-US/External/userHome/applications
      job_apply_entry_mode: role_page_click
      requires_account_before_form: true
      supports_resume_autofill: true
      supports_guest_apply: false
      session_storage_key: takeda

    - portal_id: msd
